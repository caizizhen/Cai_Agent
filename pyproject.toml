[project]
name = "cai-agent"
version = "1.2.0"
description = "Layered Pi engine + DeepSeek Harness–inspired desktop/CLI/Web UI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cai-agent = "cai_agent.__main__:main"
cai = "cai_agent.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cai_agent = ["surfaces/web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
